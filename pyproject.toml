[project]
name = "oc-rag-system"
version = "0.1.0"
description = ""
authors = [
    {name = "Amaury",email = "amaurygauthier31@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "faiss-cpu (>=1.15.1,<2.0.0)",
    "mistralai (>=3.4.0,<4.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-huggingface (>=1.2.3,<2.0.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
    "pandas (>=3.1.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests qui interrogent la vraie API Opendatasoft (pytest -m integration)",
]
